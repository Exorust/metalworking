<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 500" role="img" aria-label="Memory hierarchies compared: NVIDIA A100 and Apple M-series GPUs">
  <!-- Hand-authored. Palette: phosphor green = compute/caches, amber = DRAM pools,
       dashed gray = across-PCIe. Rows are aligned by tier across the two panels. -->
  <defs>
    <marker id="ag" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L8 4L0 8z" fill="#77ef5e"/>
    </marker>
    <marker id="as" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L8 4L0 8z" fill="#a6cc97"/>
    </marker>
    <marker id="ax" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L8 4L0 8z" fill="#8a8f7a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1380" height="500" rx="6" fill="#0d180a"/>
  <line x1="690" y1="18" x2="690" y2="482" stroke="#24361d" stroke-width="1"/>

  <g font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" text-anchor="middle">

    <!-- panel titles -->
    <text x="345" y="34" font-size="16" font-weight="700" fill="#77ef5e">NVIDIA — A100</text>
    <text x="1035" y="34" font-size="16" font-weight="700" fill="#77ef5e">APPLE — M-SERIES</text>

    <!-- ============ compute row ============ -->
    <!-- NV SM 0 -->
    <g>
      <rect x="30" y="50" width="290" height="132" fill="#12240d" stroke="#77ef5e" stroke-width="2"/>
      <text x="175" y="70" font-size="13" font-weight="700" fill="#77ef5e">SM 0</text>
      <rect x="55" y="80" width="240" height="38" fill="#1c3315" stroke="#a6cc97"/>
      <text x="175" y="96" font-size="11.5" font-weight="700" fill="#d9ead0">REGISTERS</text>
      <text x="175" y="110" font-size="10.5" fill="#d9ead0">256 KB per SM</text>
      <line x1="125" y1="122" x2="125" y2="128" stroke="#a6cc97" stroke-width="1.5" marker-start="url(#as)" marker-end="url(#as)"/>
      <line x1="225" y1="122" x2="225" y2="128" stroke="#a6cc97" stroke-width="1.5" marker-start="url(#as)" marker-end="url(#as)"/>
      <rect x="55" y="132" width="240" height="42" fill="#0f1e0c" stroke="#77ef5e"/>
      <text x="175" y="149" font-size="11.5" font-weight="700" fill="#a6cc97">L1 / SHARED MEMORY</text>
      <text x="175" y="164" font-size="10.5" fill="#a6cc97">192 KB, configurable</text>
    </g>
    <!-- NV continuation -->
    <line x1="324" y1="118" x2="366" y2="118" stroke="#77ef5e" stroke-width="3" stroke-dasharray="8 7"/>
    <!-- NV SM 107 -->
    <g>
      <rect x="370" y="50" width="290" height="132" fill="#12240d" stroke="#77ef5e" stroke-width="2"/>
      <text x="515" y="66" font-size="12.5" font-weight="700" fill="#77ef5e">SM 107</text>
      <text x="515" y="77" font-size="9.5" fill="#6f9a62">108 SMs in A100</text>
      <rect x="395" y="80" width="240" height="38" fill="#1c3315" stroke="#a6cc97"/>
      <text x="515" y="96" font-size="11.5" font-weight="700" fill="#d9ead0">REGISTERS</text>
      <text x="515" y="110" font-size="10.5" fill="#d9ead0">256 KB per SM</text>
      <line x1="465" y1="122" x2="465" y2="128" stroke="#a6cc97" stroke-width="1.5" marker-start="url(#as)" marker-end="url(#as)"/>
      <line x1="565" y1="122" x2="565" y2="128" stroke="#a6cc97" stroke-width="1.5" marker-start="url(#as)" marker-end="url(#as)"/>
      <rect x="395" y="132" width="240" height="42" fill="#0f1e0c" stroke="#77ef5e"/>
      <text x="515" y="149" font-size="11.5" font-weight="700" fill="#a6cc97">L1 / SHARED MEMORY</text>
      <text x="515" y="164" font-size="10.5" fill="#a6cc97">192 KB, configurable</text>
    </g>

    <!-- AP CORE 0 -->
    <g>
      <rect x="720" y="50" width="290" height="132" fill="#12240d" stroke="#77ef5e" stroke-width="2"/>
      <text x="865" y="70" font-size="13" font-weight="700" fill="#77ef5e">GPU CORE 0</text>
      <rect x="745" y="80" width="240" height="38" fill="#1c3315" stroke="#a6cc97"/>
      <text x="865" y="96" font-size="11.5" font-weight="700" fill="#d9ead0">REGISTERS</text>
      <text x="865" y="110" font-size="10.5" fill="#d9ead0">~208 KB per core</text>
      <line x1="805" y1="122" x2="805" y2="128" stroke="#a6cc97" stroke-width="1.5" marker-start="url(#as)" marker-end="url(#as)"/>
      <line x1="925" y1="122" x2="925" y2="128" stroke="#a6cc97" stroke-width="1.5" marker-start="url(#as)" marker-end="url(#as)"/>
      <rect x="745" y="132" width="115" height="42" fill="#0f1e0c" stroke="#77ef5e"/>
      <text x="802" y="149" font-size="10" font-weight="700" fill="#a6cc97">THREADGROUP+TILE</text>
      <text x="802" y="164" font-size="9.5" fill="#a6cc97">32 KB / threadgroup</text>
      <rect x="870" y="132" width="115" height="42" fill="#0f1e0c" stroke="#77ef5e"/>
      <text x="927" y="149" font-size="10" font-weight="700" fill="#a6cc97">L1</text>
      <text x="927" y="164" font-size="9.5" fill="#a6cc97">8 KB D · 12 KB I</text>
    </g>
    <!-- AP continuation -->
    <line x1="1014" y1="118" x2="1056" y2="118" stroke="#77ef5e" stroke-width="3" stroke-dasharray="8 7"/>
    <!-- AP CORE N-1 -->
    <g>
      <rect x="1060" y="50" width="290" height="132" fill="#12240d" stroke="#77ef5e" stroke-width="2"/>
      <text x="1205" y="66" font-size="12.5" font-weight="700" fill="#77ef5e">GPU CORE N−1</text>
      <text x="1205" y="77" font-size="9.5" fill="#6f9a62">10 in M5 · 40 in M5 Max</text>
      <rect x="1085" y="80" width="240" height="38" fill="#1c3315" stroke="#a6cc97"/>
      <text x="1205" y="96" font-size="11.5" font-weight="700" fill="#d9ead0">REGISTERS</text>
      <text x="1205" y="110" font-size="10.5" fill="#d9ead0">~208 KB per core</text>
      <line x1="1145" y1="122" x2="1145" y2="128" stroke="#a6cc97" stroke-width="1.5" marker-start="url(#as)" marker-end="url(#as)"/>
      <line x1="1265" y1="122" x2="1265" y2="128" stroke="#a6cc97" stroke-width="1.5" marker-start="url(#as)" marker-end="url(#as)"/>
      <rect x="1085" y="132" width="115" height="42" fill="#0f1e0c" stroke="#77ef5e"/>
      <text x="1142" y="149" font-size="10" font-weight="700" fill="#a6cc97">THREADGROUP+TILE</text>
      <text x="1142" y="164" font-size="9.5" fill="#a6cc97">32 KB / threadgroup</text>
      <rect x="1210" y="132" width="115" height="42" fill="#0f1e0c" stroke="#77ef5e"/>
      <text x="1267" y="149" font-size="10" font-weight="700" fill="#a6cc97">L1</text>
      <text x="1267" y="164" font-size="9.5" fill="#a6cc97">8 KB D · 12 KB I</text>
    </g>

    <!-- ============ bus to L2 ============ -->
    <g stroke="#a6cc97" stroke-width="2" fill="none">
      <path d="M175 182V204H515V182"/>
      <path d="M345 204V217" marker-end="url(#as)"/>
      <path d="M865 182V204H1205V182"/>
      <path d="M1035 204V217" marker-end="url(#as)"/>
    </g>

    <!-- ============ L2 row ============ -->
    <rect x="30" y="224" width="630" height="40" fill="#77ef5e"/>
    <text x="345" y="249" font-size="13" font-weight="700" fill="#0d180a">L2 CACHE — 40 MB</text>
    <rect x="720" y="224" width="630" height="40" fill="#77ef5e"/>
    <text x="1035" y="249" font-size="13" font-weight="700" fill="#0d180a">GPU LAST-LEVEL CACHE (L2) — 256 KB…1.5 MB BY CHIP</text>

    <!-- ============ SLC row ============ -->
    <!-- NV: no equivalent tier; trunk passes through -->
    <line x1="345" y1="269" x2="345" y2="351" stroke="#77ef5e" stroke-width="3" marker-start="url(#ag)" marker-end="url(#ag)"/>
    <rect x="30" y="290" width="630" height="40" fill="none" stroke="#2c4423" stroke-dasharray="5 5"/>
    <text x="188" y="314" font-size="10.5" fill="#4a6a3e">( no equivalent tier )</text>
    <!-- AP: SLC -->
    <line x1="1035" y1="267" x2="1035" y2="287" stroke="#77ef5e" stroke-width="2.5" marker-start="url(#ag)" marker-end="url(#ag)"/>
    <rect x="720" y="290" width="630" height="40" fill="#2c5423" stroke="#77ef5e"/>
    <text x="1035" y="315" font-size="12.5" font-weight="700" fill="#d9ead0">SYSTEM LEVEL CACHE (SLC) — 48 MB IN M1 MAX · SHARED WITH CPU + ANE</text>
    <line x1="1035" y1="333" x2="1035" y2="353" stroke="#77ef5e" stroke-width="2.5" marker-start="url(#ag)" marker-end="url(#ag)"/>

    <!-- ============ DRAM row ============ -->
    <rect x="30" y="356" width="630" height="48" fill="#e8c268"/>
    <text x="345" y="376" font-size="12.5" font-weight="700" fill="#1a1608">GLOBAL MEMORY — HBM, 40 GB, ~1.6 TB/s</text>
    <text x="345" y="393" font-size="11" fill="#1a1608">GPU-only: the CPU cannot see this pool</text>
    <rect x="720" y="356" width="630" height="48" fill="#e8c268"/>
    <text x="1035" y="376" font-size="12.5" font-weight="700" fill="#1a1608">UNIFIED MEMORY — LPDDR, ONE POOL FOR CPU + GPU + ANE</text>
    <text x="1035" y="393" font-size="11" fill="#1a1608">M5: ~153 GB/s · M5 Max: ~614 GB/s</text>

    <!-- ============ bottom row ============ -->
    <!-- NV: host across PCIe -->
    <line x1="345" y1="404" x2="345" y2="430" stroke="#8a8f7a" stroke-width="2" stroke-dasharray="5 4" marker-start="url(#ax)" marker-end="url(#ax)"/>
    <text x="357" y="422" font-size="10.5" fill="#8a8f7a" text-anchor="start">PCIe ~32 GB/s · cudaMemcpy</text>
    <rect x="30" y="434" width="630" height="40" fill="none" stroke="#8a8f7a" stroke-dasharray="6 5"/>
    <text x="345" y="459" font-size="12.5" font-weight="700" fill="#b9bfa9">CPU + HOST RAM — A SEPARATE POOL</text>
    <!-- AP: dynamic caching footnote, attached to its panel -->
    <text x="1035" y="448" font-size="10.5" fill="#6f9a62">M3 AND LATER — DYNAMIC CACHING:</text>
    <text x="1035" y="463" font-size="10.5" fill="#6f9a62">registers, threadgroup, tile and stack come from one on-core pool</text>
  </g>
</svg>
