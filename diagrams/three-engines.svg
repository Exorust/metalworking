<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 400" role="img" aria-label="One die, three matrix engines: the CPU cluster with its AMX coprocessor, the GPU cores, and the Neural Engine, all sharing the unified memory fabric, each reachable through a different API" font-family="Azeret Mono, ui-monospace, Menlo, monospace">
  <!-- Hand-authored. Green = the GPU (this glossary's territory), slc = AMX,
       gray = the ANE (private-API land). Amber = the shared memory they compete over. -->
  <rect width="1380" height="400" rx="6" fill="#0d180a"/>
  <text x="40" y="50" font-size="13" fill="#a6cc97">ONE DIE, THREE MATRIX ENGINES</text>

  <!-- die outline -->
  <rect x="40" y="66" width="1300" height="220" fill="#0f1e0c" stroke="#24361d" rx="6"/>

  <!-- CPU + AMX -->
  <rect x="70" y="90" width="380" height="130" fill="#12240d" stroke="#24361d" rx="4"/>
  <text x="260" y="116" font-size="11.5" fill="#a6cc97" text-anchor="middle">CPU cluster</text>
  <rect x="100" y="130" width="150" height="66" fill="#2c5423" rx="3"/>
  <text x="175" y="156" font-size="10.5" fill="#d9ead0" text-anchor="middle">AMX</text>
  <text x="175" y="172" font-size="8.5" fill="#a6cc97" text-anchor="middle">32×32 MAC grid</text>
  <text x="175" y="186" font-size="8.5" fill="#a6cc97" text-anchor="middle">outer product / instr</text>
  <text x="345" y="156" font-size="9" fill="#6f9a62" text-anchor="middle">wins small matrices:</text>
  <text x="345" y="172" font-size="9" fill="#6f9a62" text-anchor="middle">no launch overhead,</text>
  <text x="345" y="186" font-size="9" fill="#6f9a62" text-anchor="middle">no round trips</text>

  <!-- GPU -->
  <rect x="490" y="90" width="420" height="130" fill="#1c3315" stroke="#77ef5e" rx="4"/>
  <text x="700" y="116" font-size="11.5" fill="#d9ead0" text-anchor="middle">GPU · N cores</text>
  <g fill="#77ef5e">
    <rect x="530" y="136" width="52" height="52" rx="2"/><rect x="592" y="136" width="52" height="52" rx="2"/>
    <rect x="654" y="136" width="52" height="52" rx="2"/><rect x="716" y="136" width="52" height="52" rx="2"/>
  </g>
  <text x="840" y="156" font-size="9" fill="#a6cc97" text-anchor="middle">simdgroup_matrix</text>
  <text x="840" y="172" font-size="9" fill="#6f9a62" text-anchor="middle">this glossary's</text>
  <text x="840" y="186" font-size="9" fill="#6f9a62" text-anchor="middle">territory</text>

  <!-- ANE -->
  <rect x="950" y="90" width="360" height="130" fill="none" stroke="#8a8f7a" stroke-dasharray="5 5" rx="4"/>
  <text x="1130" y="116" font-size="11.5" fill="#b9bfa9" text-anchor="middle">Neural Engine (ANE)</text>
  <text x="1130" y="146" font-size="9" fill="#8a8f7a" text-anchor="middle">~6.6 TFLOPS/watt (vs ~1 for the GPU)</text>
  <text x="1130" y="164" font-size="9" fill="#8a8f7a" text-anchor="middle">quantized-conv-shaped inference at low power</text>
  <text x="1130" y="196" font-size="9" fill="#4a6a3e" text-anchor="middle">Apple's frameworks may route here without telling you</text>

  <!-- fabric -->
  <rect x="70" y="240" width="1240" height="30" fill="#e8c268" rx="3"/>
  <text x="690" y="260" font-size="10.5" fill="#1a1608" text-anchor="middle">unified memory fabric · one pool, one bandwidth budget: the three engines compete for it</text>
  <g stroke="#e8c268">
    <line x1="260" y1="220" x2="260" y2="240" stroke-width="2"/>
    <line x1="700" y1="220" x2="700" y2="240" stroke-width="2"/>
    <line x1="1130" y1="220" x2="1130" y2="240" stroke-width="2"/>
  </g>

  <!-- API rows -->
  <text x="40" y="322" font-size="10.5" fill="#a6cc97">the API that reaches each:</text>
  <rect x="70" y="336" width="380" height="26" fill="#12240d" stroke="#24361d" rx="3"/>
  <text x="260" y="353" font-size="9.5" fill="#a6cc97" text-anchor="middle">Accelerate / BNNS (sanctioned) · corsix/amx (docs)</text>
  <rect x="490" y="336" width="420" height="26" fill="#1c3315" stroke="#77ef5e" rx="3"/>
  <text x="700" y="353" font-size="9.5" fill="#d9ead0" text-anchor="middle">Metal · MSL · MLX</text>
  <rect x="950" y="336" width="360" height="26" fill="#0f1e0c" stroke="#8a8f7a" stroke-dasharray="5 5" rx="3"/>
  <text x="1130" y="353" font-size="9.5" fill="#b9bfa9" text-anchor="middle">Core ML only · private APIs otherwise</text>
</svg>
