<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 440" role="img" aria-label="Two submission patterns compared on CPU and GPU timelines: chatty per-op commit and wait leaves the GPU idle between ops; one command buffer per forward pass keeps the GPU continuously busy" font-family="Azeret Mono, ui-monospace, Menlo, monospace">
  <!-- Hand-authored. Green = GPU busy, soft boxes = CPU encoding,
       dashed gray = idle time. Time flows right. -->
  <rect width="1380" height="440" rx="6" fill="#0d180a"/>

  <!-- ===== left: chatty ===== -->
  <text x="40" y="50" font-size="13" fill="#e8c268">CHATTY: commit + wait per op</text>
  <text x="360" y="86" font-size="10.5" fill="#6f9a62" text-anchor="end">CPU</text>
  <text x="360" y="156" font-size="10.5" fill="#6f9a62" text-anchor="end">GPU</text>
  <!-- CPU lane -->
  <g>
    <rect x="380" y="70" width="60" height="26" fill="#1c3315" rx="2"/>
    <text x="410" y="87" font-size="8.5" fill="#d9ead0" text-anchor="middle">encode</text>
    <rect x="446" y="70" width="50" height="26" fill="none" stroke="#8a8f7a" stroke-dasharray="3 3" rx="2"/>
    <text x="471" y="87" font-size="8.5" fill="#b9bfa9" text-anchor="middle">wait</text>
    <rect x="502" y="70" width="60" height="26" fill="#1c3315" rx="2"/>
    <text x="532" y="87" font-size="8.5" fill="#d9ead0" text-anchor="middle">encode</text>
    <rect x="568" y="70" width="50" height="26" fill="none" stroke="#8a8f7a" stroke-dasharray="3 3" rx="2"/>
    <text x="593" y="87" font-size="8.5" fill="#b9bfa9" text-anchor="middle">wait</text>
    <rect x="624" y="70" width="60" height="26" fill="#1c3315" rx="2"/>
    <text x="654" y="87" font-size="8.5" fill="#d9ead0" text-anchor="middle">encode</text>
  </g>
  <!-- GPU lane -->
  <g>
    <rect x="380" y="140" width="56" height="26" fill="none" stroke="#8a8f7a" stroke-dasharray="3 3" rx="2"/>
    <rect x="442" y="140" width="52" height="26" fill="#2c5423" rx="2"/>
    <text x="468" y="157" font-size="8.5" fill="#d9ead0" text-anchor="middle">op 0</text>
    <rect x="500" y="140" width="58" height="26" fill="none" stroke="#8a8f7a" stroke-dasharray="3 3" rx="2"/>
    <rect x="564" y="140" width="52" height="26" fill="#2c5423" rx="2"/>
    <text x="590" y="157" font-size="8.5" fill="#d9ead0" text-anchor="middle">op 1</text>
    <rect x="622" y="140" width="58" height="26" fill="none" stroke="#8a8f7a" stroke-dasharray="3 3" rx="2"/>
  </g>
  <text x="40" y="86" font-size="9.5" fill="#6f9a62">every wait drains the</text>
  <text x="40" y="100" font-size="9.5" fill="#6f9a62">pipeline: the GPU idles</text>
  <text x="40" y="114" font-size="9.5" fill="#6f9a62">while the CPU wakes,</text>
  <text x="40" y="128" font-size="9.5" fill="#6f9a62">reads, re-encodes</text>
  <text x="40" y="160" font-size="9.5" fill="#e8c268">dashed = idle</text>

  <!-- divider -->
  <line x1="710" y1="40" x2="710" y2="200" stroke="#24361d"/>

  <!-- ===== right: batched ===== -->
  <text x="740" y="50" font-size="13" fill="#77ef5e">BATCHED: one command buffer per forward pass</text>
  <!-- CPU lane -->
  <g>
    <rect x="740" y="70" width="200" height="26" fill="#1c3315" rx="2"/>
    <text x="840" y="87" font-size="8.5" fill="#d9ead0" text-anchor="middle">encode every layer's dispatches</text>
    <rect x="946" y="70" width="56" height="26" fill="#77ef5e" rx="2"/>
    <text x="974" y="87" font-size="8.5" fill="#0d180a" text-anchor="middle">commit</text>
    <rect x="1008" y="70" width="290" height="26" fill="none" stroke="#2c4423" rx="2"/>
    <text x="1153" y="87" font-size="8.5" fill="#6f9a62" text-anchor="middle">CPU free (prepare next step, no waiting)</text>
  </g>
  <!-- GPU lane -->
  <g>
    <rect x="1008" y="140" width="290" height="26" fill="#2c5423" rx="2"/>
    <text x="1153" y="157" font-size="8.5" fill="#d9ead0" text-anchor="middle">op 0 · op 1 · op 2 · ... continuously busy</text>
  </g>
  <text x="740" y="160" font-size="9.5" fill="#6f9a62">per-dispatch overhead inside</text>
  <text x="740" y="174" font-size="9.5" fill="#6f9a62">one buffer is tiny; the</text>
  <text x="740" y="188" font-size="9.5" fill="#6f9a62">per-buffer cost is paid once</text>

  <!-- ===== structure key ===== -->
  <line x1="40" y1="228" x2="1340" y2="228" stroke="#24361d"/>
  <text x="40" y="262" font-size="11.5" fill="#a6cc97">the objects:</text>
  <g>
    <rect x="200" y="244" width="240" height="30" fill="#0f1e0c" stroke="#24361d" rx="3"/>
    <text x="320" y="263" font-size="10" fill="#a6cc97" text-anchor="middle">MTLCommandQueue</text>
    <rect x="480" y="244" width="260" height="30" fill="#12240d" stroke="#24361d" rx="3"/>
    <text x="610" y="263" font-size="10" fill="#a6cc97" text-anchor="middle">MTLCommandBuffer (the batch)</text>
    <rect x="780" y="244" width="300" height="30" fill="#1c3315" stroke="#24361d" rx="3"/>
    <text x="930" y="263" font-size="10" fill="#d9ead0" text-anchor="middle">MTLComputeCommandEncoder</text>
    <g stroke="#6f9a62" fill="#6f9a62">
      <line x1="440" y1="259" x2="472" y2="259"/><path d="M472 255 L480 259 L472 263 Z" stroke="none"/>
      <line x1="740" y1="259" x2="772" y2="259"/><path d="M772 255 L780 259 L772 263 Z" stroke="none"/>
    </g>
  </g>
  <text x="200" y="296" font-size="9.5" fill="#6f9a62">ordered lane of work · make one, keep it</text>
  <text x="480" y="296" font-size="9.5" fill="#6f9a62">create → encode → commit → (optionally) wait</text>
  <text x="780" y="296" font-size="9.5" fill="#6f9a62">setComputePipelineState, setBuffer, dispatchThreadgroups...</text>

  <!-- receipts -->
  <text x="40" y="346" font-size="10.5" fill="#a6cc97">receipts:</text>
  <text x="140" y="346" font-size="9.5" fill="#6f9a62">Luminal runs all of Llama 3 8B as a single command buffer · DFlash gained a measured win from</text>
  <text x="140" y="362" font-size="9.5" fill="#6f9a62">nothing but halving syncs (one mx.eval per step) · GPUStartTime / GPUEndTime on a completed buffer</text>
  <text x="140" y="378" font-size="9.5" fill="#6f9a62">is the platform's only programmatic GPU timing: one more reason buffers should be meaningful units</text>
  <text x="40" y="414" font-size="10.5" fill="#e8c268">when a CUDA port is mysteriously slow at small batch sizes, count your command buffers first</text>
</svg>
