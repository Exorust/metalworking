<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 470" role="img" aria-label="Three timelines: single-buffered loads and compute alternate serially; double-buffered prefetch overlaps the next load with the current compute; the dead DMA era overlapped fully on a separate copy engine" font-family="Azeret Mono, ui-monospace, Menlo, monospace">
  <!-- Hand-authored. Amber = tile loads, green = compute, dashed gray = the dead DMA engine.
       Barrier ticks are the thin vertical lines. Time flows right. -->
  <rect width="1380" height="470" rx="6" fill="#0d180a"/>

  <!-- time axis -->
  <g stroke="#6f9a62" fill="#6f9a62">
    <line x1="240" y1="52" x2="1310" y2="52" stroke-width="1"/>
    <path d="M1310 47 L1320 52 L1310 57 Z" stroke="none"/>
  </g>
  <text x="240" y="40" font-size="10.5" fill="#6f9a62">time</text>

  <!-- ===== Lane 1: single-buffered ===== -->
  <text x="40" y="105" font-size="12.5" fill="#a6cc97">single-buffered</text>
  <text x="40" y="122" font-size="9.5" fill="#6f9a62">loads and math take turns</text>
  <g>
    <rect x="240" y="88" width="130" height="34" fill="#e8c268" rx="2"/>
    <text x="305" y="110" font-size="10" fill="#1a1608" text-anchor="middle">load tile 0</text>
    <rect x="378" y="88" width="150" height="34" fill="#2c5423" rx="2"/>
    <text x="453" y="110" font-size="10" fill="#d9ead0" text-anchor="middle">compute 0</text>
    <rect x="536" y="88" width="130" height="34" fill="#e8c268" rx="2"/>
    <text x="601" y="110" font-size="10" fill="#1a1608" text-anchor="middle">load tile 1</text>
    <rect x="674" y="88" width="150" height="34" fill="#2c5423" rx="2"/>
    <text x="749" y="110" font-size="10" fill="#d9ead0" text-anchor="middle">compute 1</text>
    <rect x="832" y="88" width="130" height="34" fill="#e8c268" rx="2"/>
    <text x="897" y="110" font-size="10" fill="#1a1608" text-anchor="middle">load tile 2</text>
    <rect x="970" y="88" width="150" height="34" fill="#2c5423" rx="2"/>
    <text x="1045" y="110" font-size="10" fill="#d9ead0" text-anchor="middle">compute 2</text>
    <!-- barriers -->
    <g stroke="#77ef5e" stroke-width="1.5">
      <line x1="373" y1="82" x2="373" y2="128"/>
      <line x1="669" y1="82" x2="669" y2="128"/>
      <line x1="965" y1="82" x2="965" y2="128"/>
    </g>
  </g>
  <text x="1130" y="110" font-size="9.5" fill="#6f9a62">ALUs idle during every load</text>

  <!-- ===== Lane 2: double-buffered ===== -->
  <text x="40" y="215" font-size="12.5" fill="#a6cc97">double-buffered</text>
  <text x="40" y="232" font-size="9.5" fill="#6f9a62">prefetch overlaps via ILP;</text>
  <text x="40" y="246" font-size="9.5" fill="#6f9a62">same threads, no idle turns</text>
  <g>
    <!-- prologue load -->
    <rect x="240" y="188" width="130" height="30" fill="#e8c268" rx="2"/>
    <text x="305" y="207" font-size="10" fill="#1a1608" text-anchor="middle">load 0 (buf A)</text>
    <!-- compute row -->
    <rect x="378" y="222" width="180" height="30" fill="#2c5423" rx="2"/>
    <text x="468" y="241" font-size="10" fill="#d9ead0" text-anchor="middle">compute 0 (buf A)</text>
    <rect x="566" y="222" width="180" height="30" fill="#2c5423" rx="2"/>
    <text x="656" y="241" font-size="10" fill="#d9ead0" text-anchor="middle">compute 1 (buf B)</text>
    <rect x="754" y="222" width="180" height="30" fill="#2c5423" rx="2"/>
    <text x="844" y="241" font-size="10" fill="#d9ead0" text-anchor="middle">compute 2 (buf A)</text>
    <!-- overlapped loads, drawn above the compute row -->
    <rect x="378" y="188" width="130" height="30" fill="#e8c268" rx="2"/>
    <text x="443" y="207" font-size="10" fill="#1a1608" text-anchor="middle">load 1 (buf B)</text>
    <rect x="566" y="188" width="130" height="30" fill="#e8c268" rx="2"/>
    <text x="631" y="207" font-size="10" fill="#1a1608" text-anchor="middle">load 2 (buf A)</text>
    <!-- barriers: one per iteration -->
    <g stroke="#77ef5e" stroke-width="1.5">
      <line x1="373" y1="182" x2="373" y2="258"/>
      <line x1="561" y1="182" x2="561" y2="258"/>
      <line x1="749" y1="182" x2="749" y2="258"/>
    </g>
  </g>
  <text x="950" y="207" font-size="9.5" fill="#6f9a62">interleaved by the scheduler:</text>
  <text x="950" y="221" font-size="9.5" fill="#6f9a62">no data dependence between</text>
  <text x="950" y="235" font-size="9.5" fill="#6f9a62">load l+1 and compute l</text>
  <text x="950" y="255" font-size="9.5" fill="#e8c268">cost: 2&#215; threadgroup memory</text>

  <!-- ===== Lane 3: the DMA era (ghosted) ===== -->
  <text x="40" y="340" font-size="12.5" fill="#4a6a3e">the DMA era</text>
  <text x="40" y="357" font-size="9.5" fill="#4a6a3e">simdgroup_async_copy;</text>
  <text x="40" y="371" font-size="9.5" fill="#4a6a3e">dead since Metal 4</text>
  <g stroke-dasharray="4 4">
    <!-- copy engine row -->
    <rect x="240" y="316" width="120" height="26" fill="none" stroke="#8a8f7a" rx="2"/>
    <rect x="368" y="316" width="120" height="26" fill="none" stroke="#8a8f7a" rx="2"/>
    <rect x="496" y="316" width="120" height="26" fill="none" stroke="#8a8f7a" rx="2"/>
    <!-- alu row -->
    <rect x="368" y="350" width="150" height="26" fill="none" stroke="#2c4423" rx="2"/>
    <rect x="526" y="350" width="150" height="26" fill="none" stroke="#2c4423" rx="2"/>
  </g>
  <text x="300" y="333" font-size="9.5" fill="#b9bfa9" text-anchor="middle">DMA copy</text>
  <text x="428" y="333" font-size="9.5" fill="#b9bfa9" text-anchor="middle">DMA copy</text>
  <text x="556" y="333" font-size="9.5" fill="#b9bfa9" text-anchor="middle">DMA copy</text>
  <text x="443" y="367" font-size="9.5" fill="#4a6a3e" text-anchor="middle">compute 0</text>
  <text x="601" y="367" font-size="9.5" fill="#4a6a3e" text-anchor="middle">compute 1</text>
  <text x="700" y="333" font-size="9.5" fill="#4a6a3e">true copy/compute overlap on a separate engine:</text>
  <text x="700" y="349" font-size="9.5" fill="#4a6a3e">what double buffering approximates with ILP</text>

  <!-- footer -->
  <text x="690" y="440" font-size="10.5" fill="#6f9a62" text-anchor="middle">the measured verdict flips with size: 3&#215; faster at 1024&#178;, slightly slower at 4096&#178;, converged at 8192&#178;</text>
</svg>
