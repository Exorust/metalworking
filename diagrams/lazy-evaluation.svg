<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 420" role="img" aria-label="MLX's record-then-commit model: Python ops append graph nodes instantly, evaluation walks the graph and batches kernels into command buffers; an accidental mid-loop eval forces a pipeline drain every iteration" font-family="Azeret Mono, ui-monospace, Menlo, monospace">
  <!-- Hand-authored. Green = recorded graph and batched GPU work,
       amber = the eval boundary, dashed gray = the accidental drain. -->
  <rect width="1380" height="420" rx="6" fill="#0d180a"/>

  <!-- ===== recording ===== -->
  <text x="40" y="50" font-size="13" fill="#a6cc97">RECORD · ops return instantly</text>
  <g>
    <rect x="40" y="70" width="130" height="34" fill="#12240d" stroke="#24361d" rx="3"/>
    <text x="105" y="92" font-size="9.5" fill="#a6cc97" text-anchor="middle">mx.matmul</text>
    <rect x="186" y="70" width="130" height="34" fill="#12240d" stroke="#24361d" rx="3"/>
    <text x="251" y="92" font-size="9.5" fill="#a6cc97" text-anchor="middle">mx.silu</text>
    <rect x="332" y="70" width="130" height="34" fill="#12240d" stroke="#24361d" rx="3"/>
    <text x="397" y="92" font-size="9.5" fill="#a6cc97" text-anchor="middle">mx.add</text>
    <rect x="478" y="70" width="130" height="34" fill="#12240d" stroke="#24361d" rx="3"/>
    <text x="543" y="92" font-size="9.5" fill="#a6cc97" text-anchor="middle">mx.matmul</text>
    <g stroke="#6f9a62" fill="#6f9a62">
      <line x1="170" y1="87" x2="180" y2="87"/><path d="M180 83 L186 87 L180 91 Z" stroke="none"/>
      <line x1="316" y1="87" x2="326" y2="87"/><path d="M326 83 L332 87 L326 91 Z" stroke="none"/>
      <line x1="462" y1="87" x2="472" y2="87"/><path d="M472 83 L478 87 L472 91 Z" stroke="none"/>
    </g>
  </g>
  <text x="40" y="132" font-size="9.5" fill="#6f9a62">no GPU work yet: each call appends a node to the graph</text>

  <!-- eval boundary -->
  <rect x="660" y="56" width="120" height="64" fill="#e8c268" rx="3"/>
  <text x="720" y="84" font-size="11" fill="#1a1608" text-anchor="middle">mx.eval</text>
  <text x="720" y="102" font-size="8.5" fill="#1a1608" text-anchor="middle">(or .item, print,</text>
  <text x="720" y="114" font-size="8.5" fill="#1a1608" text-anchor="middle">numpy, if-on-value)</text>
  <g stroke="#e8c268" fill="#e8c268">
    <line x1="614" y1="87" x2="652" y2="87" stroke-width="1.5"/><path d="M652 82 L662 87 L652 92 Z" stroke="none"/>
  </g>

  <!-- scheduler / command buffer -->
  <rect x="830" y="56" width="510" height="64" fill="#2c5423" rx="3"/>
  <text x="1085" y="80" font-size="10.5" fill="#d9ead0" text-anchor="middle">scheduler walks the graph · eval_gpu per primitive</text>
  <text x="1085" y="100" font-size="9" fill="#a6cc97" text-anchor="middle">kernels encoded back-to-back into a shared command buffer, committed in batches</text>
  <g stroke="#77ef5e" fill="#77ef5e">
    <line x1="780" y1="87" x2="820" y2="87" stroke-width="1.5"/><path d="M820 82 L830 87 L820 92 Z" stroke="none"/>
  </g>

  <!-- ===== the rule ===== -->
  <line x1="40" y1="164" x2="1340" y2="164" stroke="#24361d"/>
  <text x="40" y="196" font-size="13" fill="#a6cc97">THE RULE · one eval per step</text>

  <!-- good loop -->
  <text x="40" y="228" font-size="10.5" fill="#77ef5e">right:</text>
  <g>
    <rect x="120" y="212" width="340" height="26" fill="#2c5423" rx="2"/>
    <text x="290" y="229" font-size="9" fill="#d9ead0" text-anchor="middle">record whole decode step</text>
    <rect x="466" y="212" width="70" height="26" fill="#e8c268" rx="2"/>
    <text x="501" y="229" font-size="9" fill="#1a1608" text-anchor="middle">eval</text>
    <rect x="542" y="212" width="340" height="26" fill="#2c5423" rx="2"/>
    <text x="712" y="229" font-size="9" fill="#d9ead0" text-anchor="middle">record next step (GPU still busy)</text>
    <rect x="888" y="212" width="70" height="26" fill="#e8c268" rx="2"/>
    <text x="923" y="229" font-size="9" fill="#1a1608" text-anchor="middle">eval</text>
  </g>
  <text x="1000" y="229" font-size="9.5" fill="#6f9a62">one sync boundary per token</text>

  <!-- bad loop -->
  <text x="40" y="282" font-size="10.5" fill="#e8c268">wrong:</text>
  <g>
    <rect x="120" y="266" width="160" height="26" fill="#2c5423" rx="2"/>
    <text x="200" y="283" font-size="9" fill="#d9ead0" text-anchor="middle">half the step</text>
    <rect x="286" y="266" width="70" height="26" fill="#e8c268" rx="2"/>
    <text x="321" y="283" font-size="9" fill="#1a1608" text-anchor="middle">eval</text>
    <rect x="362" y="266" width="90" height="26" fill="none" stroke="#8a8f7a" stroke-dasharray="3 3" rx="2"/>
    <text x="407" y="283" font-size="8.5" fill="#b9bfa9" text-anchor="middle">drain</text>
    <rect x="458" y="266" width="150" height="26" fill="#2c5423" rx="2"/>
    <text x="533" y="283" font-size="9" fill="#d9ead0" text-anchor="middle">if logit &gt; x:</text>
    <rect x="614" y="266" width="70" height="26" fill="#e8c268" rx="2"/>
    <text x="649" y="283" font-size="9" fill="#1a1608" text-anchor="middle">eval</text>
    <rect x="690" y="266" width="90" height="26" fill="none" stroke="#8a8f7a" stroke-dasharray="3 3" rx="2"/>
    <text x="735" y="283" font-size="8.5" fill="#b9bfa9" text-anchor="middle">drain</text>
    <rect x="786" y="266" width="160" height="26" fill="#2c5423" rx="2"/>
    <text x="866" y="283" font-size="9" fill="#d9ead0" text-anchor="middle">rest of step</text>
  </g>
  <text x="1000" y="283" font-size="9.5" fill="#e8c268">every accidental eval = commit, wait, wake, re-encode</text>

  <!-- streams note -->
  <line x1="40" y1="322" x2="1340" y2="322" stroke="#24361d"/>
  <text x="40" y="352" font-size="10.5" fill="#a6cc97">streams:</text>
  <text x="160" y="352" font-size="9.5" fill="#6f9a62">ops run on mx.gpu or mx.cpu (arrays have no device, so a CPU-stream op costs no transfer);</text>
  <text x="160" y="368" font-size="9.5" fill="#6f9a62">cross-stream dependencies are fenced automatically</text>
  <text x="40" y="398" font-size="9.5" fill="#4a6a3e">the DFlash war story's measured win: consolidating two evals per decode step into one</text>
</svg>
